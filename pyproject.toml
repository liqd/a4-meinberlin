[project]
name = "meinberlin"
version = "0"
requires-python = ">=3.12,<3.13"

dependencies = [
    # A4
    "adhocracy4",

    # Additional requirements
    "beautifulsoup4>=4.13.3",
    "brotli==1.2.1",
    "django-celery-beat==2.9.0",
    "django-cloudflare-push",
    "django-csp==4.0",
    "django-guest-user",
    "djangorestframework-gis==1.3.0",
    "redis==8.1.0",
    "requests==2.33.0",
    "requests-mock==1.11.0",
    "sentry-sdk[django]==2.34.1",
    "urllib3==2.8.0",
    "wagtail==7.4.4",
    "whitenoise==6.9.0",
    "zeep==4.3.3",
    "drf-spectacular==0.28.0",

    # Inherited a4-core requirements
    "celery[redis]==5.6.3",
    "kombu==5.7.0",
    "granian==2.8.8",
    "django-allauth==65.14.1",
    "django-autoslug==1.9.9",
    "django-ckeditor-5",
    "django-filter==24.3",
    "django-widget-tweaks==1.5.1",
    "Django>=5.2,<5.3",
    "djangorestframework==3.18.3",
    "easy-thumbnails==2.10",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "rules==3.5",
    "XlsxWriter==3.2.0",
    "django-polymorphic==4.8.0",
]

[project.optional-dependencies]
prod = [
    "hiredis==3.5.0",
    "gunicorn==23.0.0",
    "psycopg[c]==3.2.3",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "coveralls==4.1.0",
    "django-debug-toolbar==4.4.6",
    "djlint==1.36.3",
    "factory-boy==3.3.3",
    "Faker==33.1.0",
    "flake8==7.1.1",
    "freezegun==1.5.5",
    "isort==5.13.2",
    "psycopg[binary]==3.2.3",
    "pytest==9.0.3",
    "pytest-cov==6.0.0",
    "pytest-django==4.9.0",
    "pytest-factoryboy==2.8.1",
    "pytest-testmon==2.2.0",
    "pytest-xdist==3.8.0",
]

[tool.uv]
package = false
required-version = ">=0.13,<0.14"
# dev installs psycopg[binary], prod psycopg[c]; both cannot be active together.
conflicts = [[{ group = "dev" }, { extra = "prod" }]]

[tool.uv.sources]
# a4 main currently carries the Cap captcha integration (adhocracy4.captcha)
# required by meinberlin; pinned to an exact commit, not the mutable main branch.
adhocracy4 = { git = "https://github.com/liqd/adhocracy4.git", rev = "98ed5cece944d9bbbfa37e232e72a172508a19c4" }
django-cloudflare-push = { git = "https://github.com/skorokithakis/django-cloudflare-push.git", rev = "fcfcfc57826ecb87b9f138fd882cfb361047d850" }
django-guest-user = { git = "https://github.com/liqd/django-guest-user.git", rev = "00e250018ccd4ee848e01eaa0f6b2c6882ebc22c" }
django-ckeditor-5 = { url = "https://github.com/liqd/django-ckeditor-5/raw/refs/heads/main/dist/django_ckeditor_5-0.2.15-py3-none-any.whl" }
