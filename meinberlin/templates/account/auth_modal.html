{% load i18n %}
<dialog id="auth-modal"
        class="modal auth-modal"
        aria-label="{% translate 'Login or register' %}"
        data-loading="{% translate 'Loading …' %}"
        data-error="{% translate 'Something went wrong. Please try again.' %}"
        data-show-password="{% translate 'Show password' %}"
        data-hide-password="{% translate 'Hide password' %}">
    <button type="button" class="modal__close js-auth-modal-close" aria-label="{% translate 'Close' %}">
        <i class="fas fa-times" aria-hidden="true"></i>
    </button>
    <div class="auth-modal__body js-auth-modal-body"></div>
</dialog>
